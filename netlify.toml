# Netlify 部署配置
#
# 静态前端（web/）+ 两个无状态函数（词典代理、发音代理）。
# PDF 解析、OCR、章节识别、词条提取全部在浏览器里完成（pdf.js / tesseract.js），
# 数据存在浏览器 IndexedDB，因此 Netlify 侧不需要数据库或常驻进程。

[build]
  publish = "web"
  functions = "netlify/functions"
  command = "node tools/netlify-prepare.mjs"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # 词典/发音代理都是单次请求，10 秒足够；如遇慢网络可在站点设置里调高
  included_files = ["web/data/ipa/**"]

[[headers]]
  for = "/data/ipa/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
